<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Star Wars Battle Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial Black', sans-serif;
            background: linear-gradient(135deg, #000 0%, #1a1a2e 50%, #16213e 100%);
            color: #00ff00;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        .container {
            max-width: 1400px;
            width: 100%;
            background: rgba(0, 0, 0, 0.9);
            border: 3px solid #00ff00;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.5);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 2.5em;
            text-shadow: 0 0 10px #00ff00;
            color: #ffd700;
        }

        .canvas-container {
            width: 100%;
            height: 600px;
            background: linear-gradient(180deg, #001a4d 0%, #001a2e 100%);
            border: 2px solid #00ff00;
            border-radius: 8px;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .ui-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .player-stats, .enemy-stats {
            background: rgba(20, 20, 40, 0.8);
            border: 2px solid #00ff00;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-name {
            font-size: 1.3em;
            color: #ffd700;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .health-bar {
            background: #333;
            border: 2px solid #00ff00;
            height: 30px;
            border-radius: 5px;
            overflow: hidden;
            margin: 15px 0;
            position: relative;
        }

        .health-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ff00, #00aa00);
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: black;
            font-weight: bold;
            font-size: 0.9em;
        }

        .stat-line {
            font-size: 0.9em;
            color: #00ff00;
            margin: 8px 0;
        }

        .stat-value {
            color: #ffd700;
            font-weight: bold;
        }

        .battle-log {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #00ff00;
            padding: 15px;
            border-radius: 5px;
            max-height: 120px;
            overflow-y: auto;
            margin-bottom: 20px;
            min-height: 80px;
        }

        .log-entry {
            color: #00ff00;
            margin: 3px 0;
            font-size: 0.85em;
            padding-bottom: 3px;
        }

        .log-entry.player {
            color: #ffd700;
        }

        .log-entry.enemy {
            color: #ff6b6b;
        }

        .log-entry.critical {
            color: #ff00ff;
            font-weight: bold;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        button {
            padding: 15px 20px;
            font-size: 1em;
            font-weight: bold;
            background: linear-gradient(135deg, #00ff00, #00aa00);
            color: #000;
            border: 2px solid #00ff00;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        button:hover:not(:disabled) {
            background: linear-gradient(135deg, #00ff00, #00ff00);
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.8);
            transform: scale(1.05);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        button:active:not(:disabled) {
            transform: scale(0.98);
        }

        .enemy-selector {
            background: rgba(20, 20, 40, 0.8);
            border: 2px solid #00ff00;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        .enemy-selector h2 {
            color: #ffd700;
            margin-bottom: 15px;
        }

        .enemy-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .enemy-btn {
            padding: 15px 20px;
            font-size: 1em;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: 2px solid #667eea;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .enemy-btn:hover {
            background: linear-gradient(135deg, #764ba2, #667eea);
            box-shadow: 0 0 15px rgba(102, 126, 234, 0.8);
            transform: scale(1.05);
        }

        .game-section {
            display: none;
        }

        .game-section.active {
            display: block;
        }

        .game-over {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            border: 3px solid #ffd700;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            font-size: 1.8em;
            z-index: 1000;
            display: none;
            box-shadow: 0 0 40px rgba(0, 255, 0, 0.8);
            animation: blink 0.5s infinite;
        }

        .game-over.show {
            display: block;
        }

        .game-over.victory {
            color: #00ff00;
            border-color: #00ff00;
        }

        .game-over.defeat {
            color: #ff6b6b;
            border-color: #ff6b6b;
        }

        @keyframes blink {
            0%, 50%, 100% { opacity: 1; }
            25%, 75% { opacity: 0.5; }
        }

        .reset-btn {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            color: #000;
        }

        @media (max-width: 768px) {
            .ui-panel {
                grid-template-columns: 1fr;
            }

            .controls {
                grid-template-columns: repeat(2, 1fr);
            }

            .canvas-container {
                height: 400px;
            }

            h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚔️ 3D STAR WARS BATTLE ARENA ⚔️</h1>

        <!-- Enemy Selection Screen -->
        <div class="enemy-selector" id="enemySelector">
            <h2>🎮 Choose Your Opponent</h2>
            <p style="color: #00ff00; margin-bottom: 20px;">Select a Star Wars villain to battle against!</p>
            <div class="enemy-buttons">
                <button class="enemy-btn" onclick="selectEnemy(0)">🪖 Stormtrooper</button>
                <button class="enemy-btn" onclick="selectEnemy(1)">🤠 Han Solo</button>
                <button class="enemy-btn" onclick="selectEnemy(2)">🎯 Boba Fett</button>
                <button class="enemy-btn" onclick="selectEnemy(3)">🖤 Darth Vader</button>
            </div>
        </div>

        <!-- Game Section -->
        <div class="game-section" id="gameSection">
            <!-- 3D Canvas -->
            <div class="canvas-container">
                <canvas id="battleCanvas"></canvas>
            </div>

            <!-- Stats Panel -->
            <div class="ui-panel">
                <div class="player-stats">
                    <div class="stat-name">👨‍🚀 YOU</div>
                    <div class="health-bar">
                        <div class="health-fill" id="playerHealth" style="width: 100%">
                            <span id="playerHealthText">100/100</span>
                        </div>
                    </div>
                    <div class="stat-line">ATK: <span class="stat-value" id="playerAttack">15</span></div>
                    <div class="stat-line">LVL: <span class="stat-value" id="playerLevel">1</span></div>
                </div>

                <div class="enemy-stats">
                    <div class="stat-name" id="enemyName">🪖 STORMTROOPER</div>
                    <div class="health-bar">
                        <div class="health-fill" id="enemyHealth" style="width: 100%">
                            <span id="enemyHealthText">80/80</span>
                        </div>
                    </div>
                    <div class="stat-line">ATK: <span class="stat-value" id="enemyAttack">12</span></div>
                    <div class="stat-line">LVL: <span class="stat-value" id="enemyLevel">1</span></div>
                </div>
            </div>

            <!-- Battle Log -->
            <div class="battle-log" id="gameLog">
                <div class="log-entry">⚔️ 3D Battle arena initialized! Face off against your enemy!</div>
            </div>

            <!-- Controls -->
            <div class="controls" id="controls">
                <button onclick="playerAttack()">🔫 ATTACK</button>
                <button onclick="playerDefend()">🛡️ DEFEND</button>
                <button onclick="playerSpecial()">⚡ SPECIAL</button>
                <button onclick="playerHeal()">💊 HEAL</button>
            </div>

            <button class="reset-btn" onclick="resetGame()">🔄 NEW GAME</button>
        </div>

        <!-- Game Over Screen -->
        <div class="game-over" id="gameOverScreen"></div>
    </div>

    <script>
        // 3D Canvas Setup
        const canvas = document.getElementById('battleCanvas');
        const ctx = canvas ? canvas.getContext('2d') : null;

        function resizeCanvas() {
            if (canvas) {
                canvas.width = canvas.offsetWidth;
                canvas.height = canvas.offsetHeight;
            }
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Star Wars Battle Game
        const ENEMIES = [
            { name: 'STORMTROOPER', emoji: '🪖', maxHealth: 80, attack: 12, special: 'Rapid Fire' },
            { name: 'HAN SOLO', emoji: '🤠', maxHealth: 100, attack: 18, special: 'Quick Draw' },
            { name: 'BOBA FETT', emoji: '🎯', maxHealth: 120, attack: 22, special: 'Thermal Detonator' },
            { name: 'DARTH VADER', emoji: '🖤', maxHealth: 150, attack: 28, special: 'Force Choke' }
        ];

        let currentEnemy = 0;
        let gameState = {
            player: { health: 100, maxHealth: 100, attack: 15, defense: 0, level: 1 },
            enemy: { health: 80, maxHealth: 80, attack: 12, defense: 0, level: 1 },
            gameActive: true,
            battleLog: [],
            playerAttackAnimation: false,
            enemyAttackAnimation: false
        };

        // 3D Particle System
        let particles = [];

        class Particle {
            constructor(x, y, vx, vy, color, life = 30) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.color = color;
                this.life = life;
                this.maxLife = life;
                this.size = Math.random() * 5 + 3;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.3; // gravity
                this.life--;
            }

            draw(ctx) {
                const alpha = this.life / this.maxLife;
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function createExplosion(x, y, color, count = 15) {
            for (let i = 0; i < count; i++) {
                const angle = (Math.PI * 2 * i) / count;
                const speed = Math.random() * 4 + 2;
                const vx = Math.cos(angle) * speed;
                const vy = Math.sin(angle) * speed;
                particles.push(new Particle(x, y, vx, vy, color, 40));
            }
        }

        function drawBattle() {
            if (!ctx) return;

            // Clear canvas with gradient
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#001a4d');
            gradient.addColorStop(1, '#001a2e');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw stars background
            ctx.fillStyle = '#ffffff';
            ctx.globalAlpha = 0.3;
            for (let i = 0; i < 50; i++) {
                const x = (Date.now() * 0.01 + i * 100) % canvas.width;
                const y = Math.sin(i) * 100 + 50;
                ctx.fillRect(x, y, 2, 2);
            }
            ctx.globalAlpha = 1;

            // Player position and size
            const playerX = canvas.width * 0.25;
            const playerY = canvas.height / 2;
            const playerSize = 80;

            // Enemy position and size
            const enemyX = canvas.width * 0.75;
            const enemyY = canvas.height / 2;
            const enemySize = 80;

            // Draw 3D boxes for characters
            drawCharacter3D(playerX, playerY, playerSize, '#00ff00', true);
            drawCharacter3D(enemyX, enemyY, enemySize, '#ff6b6b', false);

            // Draw health bars in 3D
            drawHealthBar3D(playerX, playerY - playerSize / 2 - 40, 100, '#00ff00', gameState.player.health / gameState.player.maxHealth);
            drawHealthBar3D(enemyX, enemyY - enemySize / 2 - 40, 100, '#ff6b6b', gameState.enemy.health / gameState.enemy.maxHealth);

            // Draw attack animations
            if (gameState.playerAttackAnimation) {
                drawLaserBeam(playerX + playerSize / 2, playerY, enemyX - enemySize / 2, enemyY, '#ffd700');
                createExplosion(enemyX, enemyY, '#ff6b6b', 20);
                gameState.playerAttackAnimation = false;
            }

            if (gameState.enemyAttackAnimation) {
                drawLaserBeam(enemyX - enemySize / 2, enemyY, playerX + playerSize / 2, playerY, '#ff3333');
                createExplosion(playerX, playerY, '#ffaa00', 20);
                gameState.enemyAttackAnimation = false;
            }

            // Update and draw particles
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw(ctx);
                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                }
            }

            // Draw character emojis
            ctx.font = 'bold 60px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(gameState.player.emoji || '👨‍🚀', playerX, playerY);
            ctx.fillText(gameState.enemy.emoji || '🪖', enemyX, enemyY);

            // Draw level numbers
            ctx.font = 'bold 20px Arial';
            ctx.fillStyle = '#ffd700';
            ctx.fillText(`LV${gameState.player.level}`, playerX - playerSize / 2 - 20, playerY + playerSize / 2 + 30);
            ctx.fillText(`LV${gameState.enemy.level}`, enemyX + playerSize / 2 + 20, enemyY + enemySize / 2 + 30);
        }

        function drawCharacter3D(x, y, size, color, isPlayer) {
            // Draw 3D box effect
            ctx.save();
            ctx.strokeStyle = color;
            ctx.lineWidth = 3;
            ctx.globalAlpha = 0.3;

            // Front face
            ctx.strokeRect(x - size / 2, y - size / 2, size, size);

            // Back face (offset for 3D)
            ctx.strokeRect(x - size / 2 + 10, y - size / 2 + 10, size, size);

            // Connecting lines
            ctx.beginPath();
            ctx.moveTo(x - size / 2, y - size / 2);
            ctx.lineTo(x - size / 2 + 10, y - size / 2 + 10);
            ctx.moveTo(x + size / 2, y - size / 2);
            ctx.lineTo(x + size / 2 + 10, y - size / 2 + 10);
            ctx.moveTo(x - size / 2, y + size / 2);
            ctx.lineTo(x - size / 2 + 10, y + size / 2 + 10);
            ctx.moveTo(x + size / 2, y + size / 2);
            ctx.lineTo(x + size / 2 + 10, y + size / 2 + 10);
            ctx.stroke();

            ctx.restore();

            // Glow effect
            ctx.save();
            ctx.shadowColor = color;
            ctx.shadowBlur = 20;
            ctx.fillStyle = color;
            ctx.globalAlpha = 0.1;
            ctx.fillRect(x - size / 2 - 10, y - size / 2 - 10, size + 20, size + 20);
            ctx.restore();
        }

        function drawHealthBar3D(x, y, width, color, percent) {
            const height = 15;
            ctx.save();

            // Background
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.strokeRect(x - width / 2, y, width, height);

            // Health fill with gradient
            const gradient = ctx.createLinearGradient(x - width / 2, y, x - width / 2 + width * percent, y);
            gradient.addColorStop(0, color);
            gradient.addColorStop(1, '#ffffff');
            ctx.fillStyle = gradient;
            ctx.fillRect(x - width / 2, y, width * percent, height);

            // Glow
            ctx.shadowColor = color;
            ctx.shadowBlur = 10;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;

            ctx.restore();
        }

        function drawLaserBeam(fromX, fromY, toX, toY, color) {
            ctx.save();
            ctx.strokeStyle = color;
            ctx.lineWidth = 5;
            ctx.shadowColor = color;
            ctx.shadowBlur = 20;

            ctx.beginPath();
            ctx.moveTo(fromX, fromY);
            ctx.lineTo(toX, toY);
            ctx.stroke();

            // Draw glow lines
            ctx.lineWidth = 2;
            ctx.globalAlpha = 0.5;
            ctx.beginPath();
            ctx.moveTo(fromX - 5, fromY - 5);
            ctx.lineTo(toX - 5, toY - 5);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(fromX + 5, fromY + 5);
            ctx.lineTo(toX + 5, toY + 5);
            ctx.stroke();

            ctx.restore();
        }

        function animationLoop() {
            drawBattle();
            requestAnimationFrame(animationLoop);
        }

        if (canvas) {
            animationLoop();
        }

        function selectEnemy(index) {
            currentEnemy = index;
            document.getElementById('enemySelector').style.display = 'none';
            document.getElementById('gameSection').classList.add('active');
            initializeGame();
        }

        function initializeGame() {
            gameState = {
                player: { health: 100, maxHealth: 100, attack: 15, defense: 0, level: 1, emoji: '👨‍🚀' },
                enemy: { ...ENEMIES[currentEnemy], health: ENEMIES[currentEnemy].maxHealth },
                gameActive: true,
                battleLog: [],
                playerAttackAnimation: false,
                enemyAttackAnimation: false
            };

            updateDisplay();
            document.getElementById('gameOverScreen').classList.remove('show');
            document.getElementById('controls').style.display = 'grid';
            addBattleLog(`⚔️ Battle started against ${gameState.enemy.name}!`, 'critical');
        }

        function updateDisplay() {
            document.getElementById('playerHealth').style.width = (gameState.player.health / gameState.player.maxHealth) * 100 + '%';
            document.getElementById('playerHealthText').textContent = `${gameState.player.health}/${gameState.player.maxHealth}`;
            document.getElementById('playerAttack').textContent = gameState.player.attack;
            document.getElementById('playerLevel').textContent = gameState.player.level;

            document.getElementById('enemyName').textContent = gameState.enemy.emoji + ' ' + gameState.enemy.name;
            document.getElementById('enemyHealth').style.width = (gameState.enemy.health / gameState.enemy.maxHealth) * 100 + '%';
            document.getElementById('enemyHealthText').textContent = `${gameState.enemy.health}/${gameState.enemy.maxHealth}`;
            document.getElementById('enemyAttack').textContent = gameState.enemy.attack;
            document.getElementById('enemyLevel').textContent = gameState.enemy.level;
        }

        function addBattleLog(message, type = 'normal') {
            gameState.battleLog.push({ message, type });
            if (gameState.battleLog.length > 10) {
                gameState.battleLog.shift();
            }

            const logDiv = document.getElementById('gameLog');
            logDiv.innerHTML = '';
            gameState.battleLog.forEach(entry => {
                const msgDiv = document.createElement('div');
                msgDiv.className = `log-entry ${entry.type}`;
                msgDiv.textContent = entry.message;
                logDiv.appendChild(msgDiv);
            });
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function calculateDamage(attacker, defender, multiplier = 1) {
            const baseDamage = attacker.attack * multiplier;
            const variance = Math.random() * 10 - 5;
            const defenseMitigation = defender.defense * 0.5;
            return Math.max(1, Math.floor(baseDamage + variance - defenseMitigation));
        }

        function playerAttack() {
            if (!gameState.gameActive) return;

            const damage = calculateDamage(gameState.player, gameState.enemy);
            gameState.enemy.health -= damage;
            gameState.playerAttackAnimation = true;
            addBattleLog(`You attacked for ${damage} damage!`, 'player');
            gameState.player.defense = 0;
            checkGameEnd();

            if (gameState.gameActive) {
                setTimeout(enemyTurn, 1500);
            }
        }

        function playerDefend() {
            if (!gameState.gameActive) return;

            gameState.player.defense = 10;
            addBattleLog('You raise your shield!', 'player');
            setTimeout(enemyTurn, 1000);
        }

        function playerSpecial() {
            if (!gameState.gameActive) return;

            const damage = calculateDamage(gameState.player, gameState.enemy, 2.5);
            gameState.enemy.health -= damage;
            gameState.playerAttackAnimation = true;
            addBattleLog(`⚡ SPECIAL ATTACK! ${damage} critical damage!`, 'critical');
            gameState.player.defense = 0;
            checkGameEnd();

            if (gameState.gameActive) {
                setTimeout(enemyTurn, 1500);
            }
        }

        function playerHeal() {
            if (!gameState.gameActive) return;

            const actualHeal = Math.min(30, gameState.player.maxHealth - gameState.player.health);
            gameState.player.health += actualHeal;
            addBattleLog(`You heal for ${actualHeal} HP!`, 'player');
            gameState.player.defense = 0;
            setTimeout(enemyTurn, 1000);
        }

        function enemyTurn() {
            if (!gameState.gameActive) return;

            const actionChoice = Math.random();

            if (gameState.enemy.health < gameState.enemy.maxHealth * 0.3 && Math.random() > 0.5) {
                gameState.enemy.defense = 8;
                addBattleLog(`${gameState.enemy.name} defends!`, 'enemy');
            } else if (actionChoice < 0.6) {
                const damage = calculateDamage(gameState.enemy, gameState.player);
                gameState.player.health -= damage;
                gameState.enemyAttackAnimation = true;
                addBattleLog(`${gameState.enemy.name} attacks for ${damage} damage!`, 'enemy');
            } else if (actionChoice < 0.85) {
                const damage = calculateDamage(gameState.enemy, gameState.player, 2);
                gameState.player.health -= damage;
                gameState.enemyAttackAnimation = true;
                addBattleLog(`${gameState.enemy.name} uses ${gameState.enemy.special}! ${damage} damage!`, 'critical');
            } else {
                const heal = Math.min(20, gameState.enemy.maxHealth - gameState.enemy.health);
                gameState.enemy.health += heal;
                addBattleLog(`${gameState.enemy.name} heals for ${heal} HP!`, 'enemy');
            }

            gameState.player.defense = 0;
            gameState.enemy.defense = 0;
            updateDisplay();
            checkGameEnd();
        }

        function checkGameEnd() {
            updateDisplay();

            if (gameState.player.health <= 0) {
                endGame(false);
            } else if (gameState.enemy.health <= 0) {
                winBattle();
            }
        }

        function winBattle() {
            gameState.player.level++;
            gameState.player.attack += 5;
            gameState.player.health = gameState.player.maxHealth;

            addBattleLog(`✨ YOU DEFEATED ${gameState.enemy.name}!`, 'critical');

            if (currentEnemy < ENEMIES.length - 1) {
                currentEnemy++;
                setTimeout(() => {
                    addBattleLog(`Next opponent: ${ENEMIES[currentEnemy].name}!`, 'normal');
                    gameState.enemy = { ...ENEMIES[currentEnemy], health: ENEMIES[currentEnemy].maxHealth };
                    gameState.gameActive = true;
                    updateDisplay();
                }, 2000);
            } else {
                endGame(true);
            }
        }

        function endGame(victory) {
            gameState.gameActive = false;
            const screen = document.getElementById('gameOverScreen');
            const controls = document.getElementById('controls');

            if (victory) {
                screen.innerHTML = `<div>🎉 VICTORY! 🎉<br>Final Level: ${gameState.player.level}<br>Final Attack: ${gameState.player.attack}</div>`;
                screen.classList.add('victory');
            } else {
                screen.innerHTML = `<div>💀 DEFEATED 💀<br>You were defeated!<br>Reached Level: ${gameState.player.level}</div>`;
                screen.classList.add('defeat');
            }

            screen.classList.add('show');
            controls.style.display = 'none';
        }

        function resetGame() {
            document.getElementById('gameOverScreen').classList.remove('victory', 'defeat', 'show');
            document.getElementById('gameSection').classList.remove('active');
            document.getElementById('enemySelector').style.display = 'block';
            currentEnemy = 0;
            particles = [];
        }
    </script>
</body>
</html>
